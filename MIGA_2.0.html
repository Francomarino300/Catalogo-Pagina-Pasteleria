<style>
  :root{
    --paper:#FDF0F1;
    --paper-soft:#FBE1E7;
    --ink:#4A1420;
    --wine:#7A1F35;
    --rose:#F2AFC4;
    --red:#D22B3D;
    --grey:#9C7E85;
    --line: rgba(74,20,32,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.45;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; width:100%; height:100%; object-fit:cover;}
  h1,h2,.brand{font-family:'Fraunces', serif;}
 
  /* ---------- NAV ---------- */
  nav{
    position:sticky; top:0; z-index:50; background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 5%;
    display:flex; align-items:center; gap:18px;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; font-size:1.25rem; flex:0 0 auto;}
  .brand svg{width:32px; height:32px; flex:0 0 auto;}
  .cat-menu{
    display:flex; gap:8px; overflow-x:auto; flex:1 1 auto;
    scrollbar-width:none;
  }
  .cat-menu::-webkit-scrollbar{display:none;}
  .cat-link{
    white-space:nowrap; font-size:0.86rem; font-weight:600;
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    color:var(--wine);
  }
  .cat-link.active{background:var(--wine); border-color:var(--wine); color:#fff;}
  .nav-icon{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--red);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .nav-icon svg{width:18px; height:18px;}
 
  /* ---------- HERO ---------- */
  .hero{padding:44px 6% 34px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
  .hero svg{width:74px; height:74px; flex:0 0 auto;}
  .hero h1{font-size:clamp(1.6rem,3.4vw,2.3rem); font-weight:600; max-width:20ch;}
  .hero p{color:var(--grey); margin-top:6px; font-size:0.98rem;}
 
  /* ---------- MOST SOLD ---------- */
  .best{background:var(--paper-soft); padding:36px 6% 40px; margin-bottom:8px;}
  .best h2{font-size:1.15rem; font-weight:600; margin-bottom:18px; color:var(--wine);}
  .badge{
    display:inline-block; background:var(--red); color:#fff; font-size:0.7rem;
    font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:4px; margin-right:4px;
  }
  .badge.oferta{ background:var(--wine); }
 
  /* ---------- LIST ---------- */
  .cat-section{padding:40px 6% 8px; scroll-margin-top:76px;}
  .cat-section h2{font-size:1.3rem; font-weight:600; margin-bottom:6px; color:var(--wine);}
  .cat-section .sub{color:var(--grey); font-size:0.9rem; margin-bottom:8px;}
  .empty-msg{color:var(--grey); font-size:0.9rem; padding:14px 0;}
 
  .row{
    display:flex; align-items:center; gap:20px;
    padding:20px 0; border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(16px);
    transition:opacity .55s ease, transform .55s ease;
  }
  .row.visible{ opacity:1; transform:translateY(0); }
  .row:last-child{ border-bottom:none; }
  .row .ph{
    flex:0 0 auto; width:88px; height:88px; border-radius:50%;
    overflow:hidden; box-shadow:0 10px 22px rgba(74,20,32,0.20); border:3px solid #fff;
  }
  .row.out-of-stock .ph{ opacity:.4; filter:grayscale(70%); }
  .row.out-of-stock h3{ color:var(--grey); }
  .row .info{flex:1 1 auto; display:flex; justify-content:space-between; align-items:center; gap:14px;}
  .row .info h3{font-size:1rem; font-weight:600;}
  .row .info p{color:var(--grey); font-size:0.86rem; margin-top:2px; max-width:32ch;}
  .row .price{font-weight:700; color:var(--red); white-space:nowrap; font-size:1rem;}
  .row .price.out{ color:var(--grey); font-weight:600; font-size:0.88rem; }
  .row .price-old{
    color:var(--grey); font-size:0.82rem; text-decoration:line-through;
    white-space:nowrap; margin-bottom:1px;
  }
  .price-block{ display:flex; flex-direction:column; align-items:flex-end; }
 
  .price-qty{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:0 0 auto; }
  .qty-control{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:999px; padding:3px;
  }
  .qty-btn{
    width:26px; height:26px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; font-weight:700; cursor:pointer; line-height:1;
    background:var(--wine); color:#fff;
  }
  .qty-btn.minus{ background:var(--paper-soft); color:var(--wine); }
  .qty-count{ min-width:16px; text-align:center; font-weight:600; font-size:0.9rem; }
 
  /* ---------- CART FLOAT ---------- */
  .cart-float{
    position:fixed; bottom:22px; left:50%;
    transform:translateX(-50%) translateY(120px);
    background:var(--red); color:#fff; border:none; cursor:pointer;
    padding:14px 24px; border-radius:999px; font-family:'Inter', sans-serif;
    font-weight:700; font-size:0.92rem; display:flex; align-items:center; gap:10px;
    box-shadow:0 12px 30px rgba(74,20,32,0.35); z-index:60;
    opacity:0; pointer-events:none;
    transition:transform .35s ease, opacity .35s ease;
  }
  .cart-float.show{ transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto; }
  .cart-float .count{
    background:#fff; color:var(--red); border-radius:50%;
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    font-size:0.78rem; flex:0 0 auto;
  }
  .cart-float .total{ opacity:0.9; }
 
  /* ---------- LOADING ---------- */
  .loading-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:70px 6%; color:var(--grey);
  }
  .spinner{
    width:34px; height:34px; border:3px solid var(--line);
    border-top-color:var(--wine); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #catalog-content{ display:none; }
 
  @media (max-width:600px){
    .row{gap:14px;}
    .row .ph{width:72px; height:72px;}
    .row .info{flex-direction:column; align-items:flex-start; gap:8px;}
    .price-qty{ flex-direction:row; align-items:center; width:100%; justify-content:space-between; }
    .brand span{display:none;}
    .cart-float{ padding:12px 18px; font-size:0.86rem; }
  }
 
  /* ---------- CONTACT ---------- */
  .contact{margin-top:20px; background:var(--wine); color:#fff; padding:52px 6%; text-align:center;}
  .contact h2{font-family:'Fraunces', serif; font-size:1.6rem; margin-bottom:10px;}
  .contact p{color:#F0D6DC; margin-bottom:22px; font-size:0.95rem;}
  .btn-wsp{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--red); color:#fff;
    padding:15px 28px; font-weight:600; border-radius:2px; font-size:0.96rem;
  }
 
  footer{padding:20px 6% 80px; text-align:center; font-size:0.82rem; color:var(--grey);}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  /* ============================================================
     CONFIG — LO ÚNICO QUE HAY QUE TOCAR PARA UN CLIENTE NUEVO
     ============================================================
     Cambiá acá abajo: nombre, WhatsApp, colores, categorías y el
     link del Sheets. Todo lo demás (nav, hero, secciones, footer,
     meta tags) se arma solo a partir de esto.
     El favicon/logo SVG queda aparte porque suele ser un dibujo
     distinto por cliente — se edita a mano en el <head> y en el
     nav/hero si hace falta.
     ============================================================ */
  const CONFIG = {
    brand: {
      name: "MIGA",
      heroTitle: "Hecho en casa, a pedido.",
      heroSubtitle: "Elegí tu categoría arriba o mirá lo más pedido de la semana.",
      footerText: "@miga.pasteleria · Buenos Aires",
      ogDescription: "Tortas, cookies y bocaditos hechos en casa, a pedido. Mirá el catálogo y pedí por WhatsApp.",
      ogImage: "https://images.pexels.com/photos/30699756/pexels-photo-30699756.jpeg"
    },
    whatsapp: "5491139437343",
    sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSGltZqKiCma4fOgVfWxjod_ENdF2wdkvesF0_6pK7_tnaj_6RFGFkVj2FkLvC8gg/pub?gid=1751924898&single=true&output=csv",
    colors: {
      paper: "#FDF0F1",
      paperSoft: "#FBE1E7",
      ink: "#4A1420",
      wine: "#7A1F35",
      rose: "#F2AFC4",
      red: "#D22B3D",
      grey: "#9C7E85",
      /* Color de bordes/divisores. Si no lo tocás, se arma solo a partir
         de "ink" con transparencia, así siempre combina con la paleta
         del cliente sin que tengas que calcularlo a mano. */
      line: null
    },
    /* El "id" tiene que ser corto y sin espacios (se usa como ancla #id
       y como nombre de la columna "categoria" en el Sheets, en minúsculas). */
    categories: [
      { id: "tortas",    label: "Tortas",              subtitle: "Enteras, a pedido, con 48hs de anticipación." },
      { id: "cookies",   label: "Cookies y alfajores",  subtitle: "Por docena, para el mate o para regalar." },
      { id: "bocaditos", label: "Bocaditos dulces",     subtitle: "Ideales para mesas dulces y cumpleaños." },
      { id: "salado",    label: "Salado",               subtitle: "Para juntadas, cumples o el freezer de la semana." }
    ]
  };
 
  /* ============================================================
     DATOS DE RESPALDO — se usan si el Sheets no carga.
     Columnas: categoria | nombre | descripcion | precio | precio_descuento
     | stock | destacado | imagen
       - stock: si / no
       - destacado: si / no  -> se suma a "Lo más vendido"
       - precio: precio normal del producto (siempre se completa).
       - precio_descuento: opcional. Si lo cargás y es MENOR al precio
         normal, se muestra el precio normal tachado arriba y el
         descuento abajo, con un badge "Oferta". Si lo dejás vacío,
         el producto se ve normal.
     ============================================================ */
  const SAMPLE_DATA = [
    {categoria:"tortas", nombre:"Torta de Chocolate", descripcion:"Bizcochuelo húmedo con ganache y dulce de leche.", precio:"18500", precio_descuento:"", stock:"si", destacado:"si", imagen:"https://images.pexels.com/photos/30699756/pexels-photo-30699756.jpeg"},
    {categoria:"tortas", nombre:"Red Velvet", descripcion:"Con frosting de queso crema, clásica y suave.", precio:"19800", precio_descuento:"16800", stock:"si", destacado:"no", imagen:"https://media.istockphoto.com/id/956980566/photo/delicious-baked-dessert-fresh-slice-red-velvet-cake-with-tasty-cream.jpg?b=1&s=612x612&w=0&k=20&c=hxlXbtZxGb6jmiYnOCkT4u6Xk-HVu6336U2YGgZSXmU="},
    {categoria:"cookies", nombre:"Alfajores de Maicena", descripcion:"Rellenos con dulce de leche, bañados en coco.", precio:"7200", precio_descuento:"", stock:"si", destacado:"si", imagen:"https://media.istockphoto.com/id/1439225332/photo/alfajores-maicena-stuffed-with-dulce-de-leche-traditional-argentinian-sweet-milk.jpg?b=1&s=612x612&w=0&k=20&c=mKZrOS1kNzTCQCG-4mj3sODvPH7IxkrO1hh3_dirtPw="},
    {categoria:"salado", nombre:"Empanadas Caseras", descripcion:"Carne cortada a cuchillo, repulgo casero. Docena.", precio:"9500", precio_descuento:"", stock:"si", destacado:"si", imagen:"https://images.pexels.com/photos/37099445/pexels-photo-37099445.jpeg"}
  ];
 
  /* Convierte un hex (#RRGGBB) a "r,g,b" para poder armar un rgba() */
  function hexToRgbParts(hex) {
    const clean = String(hex || '').replace('#', '');
    const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
    const num = parseInt(full, 16);
    if (isNaN(num)) return '0,0,0';
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255].join(',');
  }
 
  /* ---------- APLICAR CONFIG: colores, textos, meta tags ---------- */
  function applyConfig() {
    const c = CONFIG.colors;
    const root = document.documentElement.style;
    root.setProperty('--paper', c.paper);
    root.setProperty('--paper-soft', c.paperSoft);
    root.setProperty('--ink', c.ink);
    root.setProperty('--wine', c.wine);
    root.setProperty('--rose', c.rose);
    root.setProperty('--red', c.red);
    root.setProperty('--grey', c.grey);
 
    // Si no se definió un "line" a mano, se arma solo a partir de "ink"
    // con transparencia, así siempre combina con la paleta del cliente.
    const lineColor = c.line || ('rgba(' + hexToRgbParts(c.ink) + ',0.14)');
    root.setProperty('--line', lineColor);
 
    document.title = CONFIG.brand.name + ' — Catálogo';
    document.getElementById('brand-name').textContent = CONFIG.brand.name;
    document.getElementById('hero-title').textContent = CONFIG.brand.heroTitle;
    document.getElementById('hero-subtitle').textContent = CONFIG.brand.heroSubtitle;
    document.getElementById('footer-text').textContent = CONFIG.brand.footerText;
 
    document.getElementById('meta-og-title').content = CONFIG.brand.name;
    document.getElementById('meta-og-desc').content = CONFIG.brand.ogDescription;
    document.getElementById('meta-og-image').content = CONFIG.brand.ogImage;
    document.getElementById('meta-tw-title').content = CONFIG.brand.name;
    document.getElementById('meta-tw-desc').content = CONFIG.brand.ogDescription;
    document.getElementById('meta-tw-image').content = CONFIG.brand.ogImage;
 
    const wspLink = 'https://wa.me/' + CONFIG.whatsapp;
    document.getElementById('nav-wsp').href = wspLink;
    document.getElementById('contact-wsp').href = wspLink;
  }
 
  /* Devuelve solo las categorías de CONFIG que tienen al menos un producto
     cargado en la Sheet. Si un cliente solo vende cookies, las demás
     categorías ni se muestran en el menú ni generan una sección. */
  function categoriasConProductos(data) {
    const idsConDatos = new Set(
      data.map(item => String(item.categoria || '').trim().toLowerCase())
    );
    return CONFIG.categories.filter(cat => idsConDatos.has(cat.id));
  }
 
  /* Arma el menú de categorías y sus secciones, solo para las que
     efectivamente tienen productos. */
  function buildCategoryUI(categoriasActivas) {
    const menu = document.getElementById('cat-menu');
    const sectionsWrap = document.getElementById('cat-sections');
    menu.innerHTML = '';
    sectionsWrap.innerHTML = '';
 
    categoriasActivas.forEach((cat, i) => {
      menu.insertAdjacentHTML('beforeend',
        '<a class="cat-link' + (i === 0 ? ' active' : '') + '" href="#' + cat.id + '" data-cat="' + cat.id + '">' + cat.label + '</a>'
      );
      sectionsWrap.insertAdjacentHTML('beforeend',
        '<section class="cat-section" id="' + cat.id + '" data-cat="' + cat.id + '">' +
          '<h2>' + cat.label + '</h2>' +
          '<p class="sub">' + cat.subtitle + '</p>' +
          '<div id="rows-' + cat.id + '"></div>' +
        '</section>'
      );
    });
  }
 
  function esNo(v) { return String(v || '').trim().toLowerCase() === 'no'; }
  function esSi(v) { return String(v || '').trim().toLowerCase() === 'si'; }
  function limpiarPrecio(v) {
    const soloNumeros = String(v || '').replace(/[^\d]/g, '');
    return soloNumeros ? parseInt(soloNumeros, 10) : 0;
  }
  function formatPrice(n) { return '$' + Number(n).toLocaleString('es-AR'); }
  function escapeHTML(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
 
  function rowHTML(item) {
    const outOfStock = esNo(item.stock);
    const precioNormal = limpiarPrecio(item.precio);
    const precioDescuento = limpiarPrecio(item.precio_descuento);
    const hayOferta = !outOfStock && precioDescuento > 0 && precioDescuento < precioNormal;
    const precioFinal = hayOferta ? precioDescuento : precioNormal;
 
    const destacadoBadge = esSi(item.destacado) ? '<span class="badge">Más vendido</span>' : '';
    const ofertaBadge = hayOferta ? '<span class="badge oferta">Oferta</span>' : '';
 
    let priceQtyHTML;
    if (outOfStock) {
      priceQtyHTML = '<div class="price-qty"><span class="price out">Sin stock</span></div>';
    } else {
      const priceOldHTML = hayOferta ? '<span class="price-old">' + formatPrice(precioNormal) + '</span>' : '';
      priceQtyHTML =
        '<div class="price-qty">' +
          '<div class="price-block">' + priceOldHTML + '<span class="price">' + formatPrice(precioFinal) + '</span></div>' +
          '<div class="qty-control"><button class="qty-btn minus">−</button><span class="qty-count">0</span><button class="qty-btn plus">+</button></div>' +
        '</div>';
    }
 
    return (
      '<div class="row ' + (outOfStock ? 'out-of-stock' : '') + '" data-name="' + escapeHTML(item.nombre) + '" data-price="' + precioFinal + '">' +
        '<div class="ph"><img src="' + escapeHTML(item.imagen) + '" alt="' + escapeHTML(item.nombre) + '" loading="lazy"></div>' +
        '<div class="info">' +
          '<div>' + destacadoBadge + ofertaBadge + '<h3>' + escapeHTML(item.nombre) + '</h3><p>' + escapeHTML(item.descripcion) + '</p></div>' +
          priceQtyHTML +
        '</div>' +
      '</div>'
    );
  }
 
  function render(data, categoriasActivas) {
    const containers = {};
    categoriasActivas.forEach(cat => { containers[cat.id] = 'rows-' + cat.id; });
    Object.values(containers).forEach(id => { document.getElementById(id).innerHTML = ''; });
 
    data.forEach(item => {
      const cat = String(item.categoria || '').trim().toLowerCase();
      const containerId = containers[cat];
      if (containerId) document.getElementById(containerId).insertAdjacentHTML('beforeend', rowHTML(item));
    });
 
    const destacados = data.filter(i => esSi(i.destacado));
    const bestSection = document.getElementById('best-section');
    if (destacados.length) {
      document.getElementById('best-list').innerHTML = destacados.map(rowHTML).join('');
      bestSection.style.display = '';
    } else {
      bestSection.style.display = 'none';
    }
  }
 
  async function loadData() {
    if (CONFIG.sheetCsvUrl && CONFIG.sheetCsvUrl.startsWith('http')) {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl);
        const csvText = await res.text();
        const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
        if (parsed.data && parsed.data.length) return parsed.data;
      } catch (e) {
        console.warn('No se pudo leer la hoja de cálculo, usando datos de ejemplo.', e);
      }
    }
    return SAMPLE_DATA;
  }
 
  /* ---------- NAV / SCROLL ACTIVO ---------- */
  let links, sections;
  const navEl = document.querySelector('nav');
  let isProgrammaticScroll = false;
  let scrollEndTimer = null;
 
  function setActive(cat) {
    links.forEach(l => l.classList.toggle('active', l.dataset.cat === cat));
  }
 
  function scrollToSection(cat) {
    const target = document.getElementById(cat);
    if (!target) return;
    const navHeight = navEl.offsetHeight;
    const top = target.getBoundingClientRect().top + window.scrollY - navHeight - 8;
 
    isProgrammaticScroll = true;
    clearTimeout(scrollEndTimer);
    window.scrollTo({ top, behavior: 'smooth' });
    scrollEndTimer = setTimeout(() => { isProgrammaticScroll = false; }, 700);
  }
 
  function wireNav() {
    links = document.querySelectorAll('.cat-link');
    sections = document.querySelectorAll('.cat-section');
    links.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const cat = link.dataset.cat;
        setActive(cat);
        scrollToSection(cat);
      });
    });
    if ('onscrollend' in window) {
      window.addEventListener('scrollend', () => { isProgrammaticScroll = false; });
    }
    window.addEventListener('scroll', updateActiveOnScroll, { passive: true });
    window.addEventListener('resize', updateActiveOnScroll);
  }
 
  function updateActiveOnScroll() {
    if (isProgrammaticScroll || !sections || !sections.length) return;
    const navHeight = navEl.offsetHeight;
    const refLine = navHeight + 30;
    let current = sections[0].dataset.cat;
    sections.forEach(sec => {
      const rect = sec.getBoundingClientRect();
      if (rect.top - refLine <= 0) current = sec.dataset.cat;
    });
    setActive(current);
  }
 
  /* ---------- FADE-IN AL ENTRAR EN PANTALLA ---------- */
  function wireRevealObserver() {
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
 
    document.querySelectorAll('.row').forEach(row => revealObserver.observe(row));
  }
 
  /* ---------- CARRITO + WHATSAPP ---------- */
  function wireCart() {
    const cart = {};
    const rowsByName = {};
 
    document.querySelectorAll('.row[data-name]').forEach(row => {
      const name = row.dataset.name;
      const price = parseInt(row.dataset.price, 10);
      if (!cart[name]) cart[name] = { qty: 0, price };
      if (!rowsByName[name]) rowsByName[name] = [];
      rowsByName[name].push(row);
    });
 
    const cartFloat = document.getElementById('cart-float');
    const cartCountEl = cartFloat.querySelector('.count');
    const cartTotalEl = cartFloat.querySelector('.total');
 
    function syncQtyDisplay(name) {
      rowsByName[name].forEach(row => {
        const qtyEl = row.querySelector('.qty-count');
        if (qtyEl) qtyEl.textContent = cart[name].qty;
      });
    }
 
    function updateCartUI() {
      const items = Object.values(cart).filter(i => i.qty > 0);
      const totalQty = items.reduce((s, i) => s + i.qty, 0);
      const totalPrice = items.reduce((s, i) => s + i.qty * i.price, 0);
      if (totalQty > 0) {
        cartFloat.classList.add('show');
        cartCountEl.textContent = totalQty;
        cartTotalEl.textContent = formatPrice(totalPrice);
      } else {
        cartFloat.classList.remove('show');
      }
    }
 
    Object.keys(rowsByName).forEach(name => {
      rowsByName[name].forEach(row => {
        const plusBtn = row.querySelector('.qty-btn.plus');
        const minusBtn = row.querySelector('.qty-btn.minus');
        if (!plusBtn || !minusBtn) return;
        plusBtn.addEventListener('click', () => {
          cart[name].qty++;
          syncQtyDisplay(name);
          updateCartUI();
        });
        minusBtn.addEventListener('click', () => {
          if (cart[name].qty > 0) {
            cart[name].qty--;
            syncQtyDisplay(name);
            updateCartUI();
          }
        });
      });
    });
 
    cartFloat.onclick = () => {
      const items = Object.entries(cart).filter(([_, i]) => i.qty > 0);
      if (items.length === 0) return;
      const lines = ['Hola! Quiero hacer este pedido:', ''];
      items.forEach(([name, i]) => lines.push('- ' + i.qty + ' x ' + name));
      const total = items.reduce((s, [_, i]) => s + i.qty * i.price, 0);
      lines.push('', 'Total aprox: ' + formatPrice(total));
      const msg = lines.join('\n');
      window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
    };
  }
 
  /* ---------- ARRANQUE ---------- */
  applyConfig();
 
  loadData().then(data => {
    const categoriasActivas = categoriasConProductos(data);
    buildCategoryUI(categoriasActivas);
    wireNav();
    render(data, categoriasActivas);
    wireRevealObserver();
    wireCart();
    updateActiveOnScroll();
 
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('catalog-content').style.display = 'block';
  });
</script>
 
</body>
</html>
